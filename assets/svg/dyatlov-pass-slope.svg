<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440">
  <defs>
    <mask id="dp-trail-mask">
      <path class="svg-draw" style="--len:700" d="M245 120 Q330 152 420 198 Q520 248 600 272 Q680 294 742 300" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect class="svg-bg" width="900" height="440" rx="14"/>

  <!-- survey grid -->
  <g class="svg-line" stroke-width="1" opacity=".6">
    <path d="M0 110H900M0 220H900M0 330H900M150 0V440M300 0V440M450 0V440M600 0V440M750 0V440"/>
  </g>

  <!-- contour lines -->
  <g class="svg-line" stroke-width="1.2">
    <path d="M0 150 Q80 112 150 122 Q300 170 460 248 Q640 330 900 366"/>
    <path d="M0 200 Q90 162 190 176 Q340 222 500 296 Q660 370 900 400"/>
    <path d="M0 250 Q100 214 230 230 Q380 276 540 344 Q690 404 900 432"/>
    <path d="M40 40 Q120 30 200 60 Q330 108 470 170 Q640 244 900 290" opacity=".6"/>
  </g>

  <!-- the slope -->
  <path d="M0 100 Q55 62 110 72 Q260 122 420 202 Q600 292 900 332 V440 H0Z" class="svg-ink" opacity=".05"/>
  <path class="svg-gold-stroke" d="M0 100 Q55 62 110 72 Q260 122 420 202 Q600 292 900 332" stroke-width="2"/>
  <circle cx="72" cy="70" r="3" class="svg-gold"/>
  <text x="24" y="44" class="svg-mute" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">KHOLAT SYAKHL</text>

  <!-- ravine -->
  <path class="svg-red-stroke" d="M786 324 Q812 366 846 330" stroke-width="1.8"/>

  <!-- forest and the cedar -->
  <g class="svg-stroke-mute" stroke-width="1.4" stroke-linejoin="round">
    <path d="M664 298 l14 -36 l14 36z"/><path d="M700 302 l12 -30 l12 30z"/>
    <path d="M792 318 l13 -34 l13 34z"/><path d="M828 324 l15 -38 l15 38z"/><path d="M864 330 l13 -32 l13 32z"/>
  </g>
  <g class="svg-gold-stroke" stroke-width="1.8" stroke-linejoin="round">
    <path d="M732 282 l24 -66 l24 66z"/><path d="M756 282 v20"/>
  </g>
  <path d="M772 300 q6 -16 12 0 q-6 6 -12 0z" fill="#ff6a3d"/>

  <!-- footprint trail, revealed by the mask -->
  <path mask="url(#dp-trail-mask)" class="svg-stroke" d="M245 120 Q330 152 420 198 Q520 248 600 272 Q680 294 742 300" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.5 12" opacity=".8"/>

  <!-- tent, cut from the inside -->
  <path class="svg-gold-stroke" d="M206 120 l22 -30 l26 34z" stroke-width="2" stroke-linejoin="round"/>
  <path class="svg-red-stroke" d="M220 106 l4 6 l-3 5 l4 6M236 102 l3 7 l-3 6" stroke-width="2" stroke-linecap="round"/>

  <!-- hikers found on the slope -->
  <g class="svg-cat">
    <circle class="svg-pop" style="--d:1.4s" cx="457" cy="212" r="5.5"/>
    <circle class="svg-pop" style="--d:1.6s" cx="520" cy="238" r="5.5"/>
    <circle class="svg-pop" style="--d:1.8s" cx="628" cy="272" r="5.5"/>
  </g>

  <!-- numbered pins (see legend) -->
  <g font-family="New York, Iowan Old Style, Georgia, serif" font-style="italic" font-size="20" text-anchor="middle">
    <g class="svg-pop" style="--d:.3s"><path class="svg-gold-stroke" d="M230 74 v14" stroke-width="1.2"/><circle class="svg-bg" cx="230" cy="54" r="18"/><circle class="svg-gold-stroke" cx="230" cy="54" r="18" stroke-width="1.5"/><text class="svg-gold" x="230" y="61">1</text></g>
    <g class="svg-pop" style="--d:.9s"><path class="svg-gold-stroke" d="M352 186 v20" stroke-width="1.2"/><circle class="svg-bg" cx="352" cy="226" r="18"/><circle class="svg-gold-stroke" cx="352" cy="226" r="18" stroke-width="1.5"/><text class="svg-gold" x="352" y="233">2</text></g>
    <g class="svg-pop" style="--d:1.9s"><path class="svg-gold-stroke" d="M540 198 v24" stroke-width="1.2"/><circle class="svg-bg" cx="540" cy="178" r="18"/><circle class="svg-gold-stroke" cx="540" cy="178" r="18" stroke-width="1.5"/><text class="svg-gold" x="540" y="185">3</text></g>
    <g class="svg-pop" style="--d:2.3s"><path class="svg-gold-stroke" d="M756 192 v18" stroke-width="1.2"/><circle class="svg-bg" cx="756" cy="172" r="18"/><circle class="svg-gold-stroke" cx="756" cy="172" r="18" stroke-width="1.5"/><text class="svg-gold" x="756" y="179">4</text></g>
    <g class="svg-pop" style="--d:2.7s"><path class="svg-gold-stroke" d="M816 374 v-26" stroke-width="1.2"/><circle class="svg-bg" cx="816" cy="394" r="18"/><circle class="svg-gold-stroke" cx="816" cy="394" r="18" stroke-width="1.5"/><text class="svg-gold" x="816" y="401">5</text></g>
  </g>

  <text x="24" y="418" class="svg-dim" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="2">NOT TO SCALE · ABOUT 1.5 KM FROM TENT TO CEDAR</text>
</svg>

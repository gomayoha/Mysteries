<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>The Rabbit Hole Archive</title>
  <meta name="description" content="Search and filter every case file by drawer, verdict and rabbit hole level.">
  <link rel="icon" href="assets/svg/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,wght@1,400&display=swap">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <script>try{if(localStorage.getItem("rha-theme")==="light")document.documentElement.dataset.theme="light";if(localStorage.getItem("rha-motion")==="off")document.documentElement.classList.add("calm")}catch(e){}document.documentElement.classList.add("js")</script>
  <script src="assets/js/config.js"></script>
</head>
<body data-page="explore" data-title="Explore the archive">
  <div id="site-header"></div>
  <main id="main">
    <header class="wrap page-head reveal">
      <span class="eyebrow">The stacks</span>
      <h1>Explore the <em>archive.</em></h1>
      <p>Search every case file, or filter by drawer, verdict and how deep the rabbit hole goes.</p>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
        <label class="visually-hidden" for="q">Search case files</label>
        <input id="q" type="search" placeholder="Try “cipher”, “1947” or “ocean”" autocomplete="off">
      </div>
    </header>
    <div class="wrap explore">
      <div style="display:grid;gap:14px">
        <button class="pill small ghost filters-toggle" type="button" aria-expanded="false" aria-controls="filters" data-filters-toggle>Filters</button>
        <form class="filters" id="filters" data-filters onsubmit="return false"></form>
      </div>
      <div>
        <div class="results-bar"><span data-count aria-live="polite"></span><button class="pill small ghost" type="button" data-clear hidden>Clear filters</button></div>
        <div class="cards" data-results><div class="loading">Opening the stacks</div></div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/explore.js"></script>
</body>
</html>

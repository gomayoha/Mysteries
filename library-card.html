<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>The Rabbit Hole Archive</title>
  <meta name="description" content="Your library card: every case file you've explored, plus the badges you've earned.">
  <link rel="icon" href="assets/svg/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,wght@1,400&display=swap">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <script>try{if(localStorage.getItem("rha-theme")==="light")document.documentElement.dataset.theme="light";if(localStorage.getItem("rha-motion")==="off")document.documentElement.classList.add("calm")}catch(e){}document.documentElement.classList.add("js")</script>
  <script src="assets/js/config.js"></script>
</head>
<body data-page="library" data-title="Your library card">
  <div id="site-header"></div>
  <main id="main">
    <header class="wrap page-head reveal">
      <span class="eyebrow">Borrower's record</span>
      <h1>Your library <em>card.</em></h1>
      <p>Every case file you finish gets stamped here, and your clearance rises as you read, quiz and wander. It's saved in this browser only: no accounts, nothing to sign up for.</p>
    </header>
    <div class="wrap" data-library><div class="loading">Finding your card</div></div>
  </main>
  <div id="site-footer"></div>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/library.js"></script>
</body>
</html>
